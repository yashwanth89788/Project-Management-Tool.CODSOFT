<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProManage - Project Management Tool</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0;
      background: linear-gradient(120deg, #667eea, #764ba2);
      min-height: 100vh;
      color: #333;
    }
    header {
      background: rgba(0,0,0,0.2);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }
    header h1 { margin: 0; }
    nav a {
      margin-left: 20px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
    .container {
      padding: 40px;
      display: none;
    }
    .active { display: block; }
    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h2 { text-align: center; }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      padding: 12px 25px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 16px;
    }
    .btn-primary { background: #667eea; color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-warning { background: #f39c12; color: white; }
    .btn-danger { background: #e74c3c; color: white; }
    ul { list-style: none; padding: 0; }
    li {
      background: #f4f4f4;
      margin: 10px 0;
      padding: 15px;
      border-radius: 5px;
    }
    footer {
      text-align: center;
      padding: 15px;
      color: white;
      background: rgba(0,0,0,0.2);
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>

<header>
  <h1>ProManage</h1>
  <nav>
    <a onclick="showPage('login')">Login</a>
    <a onclick="showPage('dashboard')">Dashboard</a>
    <a onclick="showPage('createProject')">Create Project</a>
  </nav>
</header>
<div id="login" class="container active">
  <div class="card">
    <h2>User Login</h2>
    <input type="email" placeholder="Email" required />
    <input type="password" placeholder="Password" required />
    <button class="btn-success" onclick="login()">Login</button>
  </div>
</div>
<div id="dashboard" class="container">
  <div class="card">
    <h2>Dashboard</h2>
    <p>Welcome to your project dashboard.</p>
    <ul id="projectList"></ul>
    <button class="btn-primary" onclick="showPage('createProject')">Create New Project</button>
  </div>
</div>
<div id="createProject" class="container">
  <div class="card">
    <h2>Create Project</h2>
    <input id="projectName" placeholder="Project Name" />
    <textarea id="projectDesc" placeholder="Project Description"></textarea>
    <button class="btn-warning" onclick="addProject()">Save Project</button>
  </div>
</div>

<footer>
  © 2025 ProManage | Project Management Tool Demo
</footer>

<script>
  let projects = [];

  function showPage(page) {
    document.querySelectorAll('.container').forEach(div => div.classList.remove('active'));
    document.getElementById(page).classList.add('active');
  }

  function login() {
    showPage('dashboard');
  }

  function addProject() {
    const name = document.getElementById('projectName').value;
    const desc = document.getElementById('projectDesc').value;
    if (!name || !desc) return;

    projects.push({ name, desc });
    renderProjects();
    showPage('dashboard');
  }

  function renderProjects() {
    const list = document.getElementById('projectList');
    list.innerHTML = '';
    projects.forEach(p => {
      const li = document.createElement('li');
      li.innerHTML = `<strong>${p.name}</strong><br>${p.desc}`;
      list.appendChild(li);
    });
  }
</script>

</body>
</html>
